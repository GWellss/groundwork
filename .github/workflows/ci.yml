name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Selftest
        run: python3 theme/theme.py --selftest
      - name: Regenerate examples
        run: |
          python3 theme/theme.py --out examples/default/DESIGN.md
          python3 theme/theme.py --dark --dark-brand accept --out examples/default-dark/DESIGN.md
      - name: Examples must be up to date
        run: git diff --exit-code

  lint:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Lint DESIGN.md files
        run: |
          npx @google/design.md@0.4.0 lint examples/default/DESIGN.md
          npx @google/design.md@0.4.0 lint examples/default-dark/DESIGN.md
          npx @google/design.md@0.4.0 lint examples/default-dark/DESIGN.dark.md
